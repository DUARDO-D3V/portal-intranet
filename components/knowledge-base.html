<section id="base-conhecimento-section" class="content-section">
  <div class="bse-knowledge-card">
    <div class="bse-header">
      <div class="bse-icon"><i data-lucide="book-open-check"></i></div>
      <h3 class="bse-title">Base de Conhecimento</h3>
      <div class="bse-header-actions">
        <button class="bse-back-btn bse-is-hidden" id="bseBackBtn" title="Voltar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5"></path><polyline points="12,19 5,12 12,5"></polyline></svg>
        </button>
        <button class="bse-refresh-btn" id="bseRefreshBtn" title="Atualizar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23,4 23,10 17,10"></polyline><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path></svg>
        </button>
      </div>
    </div>
    <div class="bse-content">
      <div class="bse-breadcrumb" id="bseBreadcrumb"></div>
      <div class="bse-search-container">
        <input type="text" id="bseSearchInput" class="bse-search-input" placeholder="Buscar documentos e pastas...">
        <svg class="bse-search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.35-4.35"></path></svg>
      </div>
      <div class="bse-main-view">
        <div class="bse-items-list" id="bseItemsList">
          <div class="bse-loading" id="bseLoading"><div class="bse-spinner"></div><span>Carregando...</span></div>
        </div>
        <div class="bse-document-viewer bse-is-hidden" id="bseDocumentViewer">
          <div class="bse-viewer-header">
            <div class="bse-viewer-title" id="bseViewerTitle"></div>
            <button class="bse-close-viewer" id="bseCloseViewer" title="Fechar">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>
          </div>
          <div class="bse-viewer-content" id="bseViewerContent"></div>
        </div>
      </div>
      <div class="bse-footer"><small class="bse-status-text" id="bseStatusText"></small></div>
    </div>
  </div>
</section>
