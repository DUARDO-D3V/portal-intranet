<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
		<title>Portal NOC</title>
		<link rel="stylesheet" href="/assets/css/login.css" />
		<link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet" />
      	<link rel="icon" href="data:,">
</head>

<body>
<div class="wrapper">
			<form id="loginForm">
				<div class="logo" aria-label="Portal NOC" style="font-size: 28px; font-weight: 700; text-align: center;">Portal NOC</div>
				<div class="input-box">
					<input type="text" id="username" placeholder="Usuário" required />
					<i class="bx bxs-user"></i>
				</div>
				<div class="input-box">
					<input type="password" id="password" placeholder="Senha" required />
					<i class="bx bxs-lock-alt"></i>
				</div>
				<div class="remember-forgot">
					<label><input type="checkbox" id="rememberMe" name="rememberMe" />Manter logado </label>
					<a href="#">Esqueceu sua senha?</a>
				</div>
				<button type="submit" class="btn">Entrar</button>
        <div id="loginMessage" style="text-align: center; margin-top: 15px; font-weight: bold;"></div>
			</form>
		</div>
		<div id="forgot-password-modal" class="modal-overlay" style="display: none;">
  <div class="modal-content">
    <button id="close-modal" class="close-button">&times;</button>
    <h2>Entrar em contato com o Suporte</h2>
  </div>
</div>
  <script src="/assets/js/login.js"></script>
</body>
</html>
